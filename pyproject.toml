[project]
name = "bidrig"
version = "0.1.0"
description = "Bid-rigging detection benchmark: simulator, collusion library, detectors, locked protocol"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["bidrig*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
